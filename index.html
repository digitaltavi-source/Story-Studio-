<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Story to Video - Professional</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-content">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span>Story2Video</span>
            </div>
            <button id="settingsBtn" class="icon-btn" title="Cài đặt">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="card">
            <div class="card-header">
                <h1>Tạo Kịch Bản Video</h1>
                <p class="subtitle">Nhập ý tưởng của bạn và AI sẽ tạo ra câu chuyện hoàn chỉnh</p>
            </div>
            
            <div class="input-group">
                <label for="storyInput">Ý tưởng câu chuyện</label>
                <textarea id="storyInput" placeholder="Ví dụ: Một chú mèo con lạc vào rừng thần tiên và gặp những người bạn mới..." rows="6"></textarea>
                <div class="word-count">Số từ: <span id="wordCount">0</span></div>
            </div>

            <div class="actions">
                <button id="generateBtn" class="btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                    Tạo câu chuyện
                </button>
            </div>
        </div>

        <!-- Result Area -->
        <div id="resultArea" class="card hidden">
            <div class="card-header">
                <h2>Kết quả</h2>
            </div>
            <div id="outputContent" class="output-content"></div>
            <div class="actions">
                <button class="btn-secondary" onclick="alert('Tính năng sao chép đang phát triển')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    Sao chép
                </button>
                <button class="btn-secondary" onclick="alert('Tính năng xuất video đang phát triển')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="23 7 16 12 23 17 23 7"/>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                    Xuất video
                </button>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Cài đặt API</h2>
                <button id="closeSettings" class="close-btn">&times;</button>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="apikey">API Key</button>
                <button class="tab-btn" data-tab="json">File JSON</button>
            </div>

            <div class="tab-content active" id="tab-apikey">
                <div class="input-group">
                    <label for="apiKeyInput">Google Gemini API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="Nhập API Key của bạn">
                    <p class="help-text">Lấy key tại <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a></p>
                </div>
            </div>

            <div class="tab-content" id="tab-json">
                <div class="input-group">
                    <label for="jsonFileInput">Tải lên Service Account JSON</label>
                    <input type="file" id="jsonFileInput" accept=".json">
                    <p class="help-text">Dành cho tài khoản Google Cloud trả phí</p>
                </div>
            </div>

            <div class="connection-status" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">Chưa kết nối</span>
            </div>

            <div class="modal-footer">
                <button id="testConnectionBtn" class="btn-secondary">Kiểm tra kết nối</button>
                <button id="saveSettingsBtn" class="btn-primary">Lưu cấu hình</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

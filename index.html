<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Story Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
            <span>StoryAI</span>
        </div>
        <button id="settingsBtn" class="icon-btn" title="Cài đặt">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="card">
            <h1>Tạo câu chuyện của bạn</h1>
            <p class="subtitle">Nhập ý tưởng và để AI giúp bạn phát triển nó.</p>
            
            <textarea id="storyInput" placeholder="Ví dụ: Một chú mèo du hành vũ trụ tìm kiếm hành tinh cá ngừ..."></textarea>
            
            <div class="controls">
                <div class="word-count">Số từ: <span id="wordCount">0</span></div>
                <button id="generateBtn" class="primary-btn">Tạo câu chuyện</button>
            </div>

            <div id="resultArea" class="result-area hidden">
                <h3>Kết quả:</h3>
                <div id="outputContent"></div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Cài đặt kết nối AI</h2>
                <button id="closeSettings" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="tab-group">
                    <button class="tab-btn active" data-tab="apikey">API Key</button>
                    <button class="tab-btn" data-tab="json">File JSON</button>
                </div>

                <!-- Tab API Key -->
                <div id="tab-apikey" class="tab-content active">
                    <label>Nhập Google Gemini API Key hoặc OpenAI Key:</label>
                    <input type="password" id="apiKeyInput" placeholder="Nhập key tại đây...">
                    <p class="help-text">Lấy key miễn phí tại <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>.</p>
                </div>

                <!-- Tab JSON -->
                <div id="tab-json" class="tab-content">
                    <label>Tải lên file Service Account JSON:</label>
                    <input type="file" id="jsonFileInput" accept=".json">
                    <p class="help-text">Dùng cho tài khoản Google Cloud trả phí.</p>
                </div>

                <div class="status-box" id="connectionStatus">
                    Trạng thái: <span class="status-dot"></span> <span class="status-text">Chưa kết nối</span>
                </div>

                <button id="testConnectionBtn" class="secondary-btn">Kiểm tra kết nối</button>
                <button id="saveSettingsBtn" class="primary-btn full-width">Lưu cấu hình</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
